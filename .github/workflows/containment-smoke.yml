name: Hosted replay direct Docker port diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-hosted-replay-ro-001
  cancel-in-progress: false

jobs:
  direct-docker-port-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Run fail-closed direct Docker port diagnostic
        run: >-
          env -i
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOME="$(pwd)/.smoke-runtime/home"
          ./scripts/run-containment-smoke.sh direct-port

      - name: Cleanup exact packet resources
        if: always()
        run: >-
          env -i
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          HOME="$(pwd)/.smoke-runtime/home"
          RESULT_PROFILE=direct-docker-port-v1
          ./scripts/run-containment-smoke.sh cleanup-only

      - name: Upload sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fp-hosted-replay-ro-001-${{ github.run_id }}
          path: artifacts/containment-smoke.json
          if-no-files-found: error
          retention-days: 7
